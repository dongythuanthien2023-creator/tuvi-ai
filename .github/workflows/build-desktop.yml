name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Build app Windows
        run: npm run electron:build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TuVi-Setup
          path: release/*.exe
